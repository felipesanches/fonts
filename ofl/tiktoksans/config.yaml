sources:
  - sources/TikTokSans.glyphspackage
splitItalic: false
buildVariable: true
buildStatic: false
buildOTF: false
autohintTTF: false
stat:
  TikTokSans[opsz,wdth,wght].ttf:
  - name: Optical size
    tag: opsz
    values:
    - name: 12pt
      value: 12
    - name: 16pt
      value: 16
    - name: 36pt
      value: 36
  - name: Width
    tag: wdth
    values:
    - name: Condensed
      value: 75
    - name: Normal
      value: 100
      flags: 2
    - name: ExtraExpanded
      value: 150
  - name: Weight
    tag: wght
    values:
    - name: Light
      value: 300
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
    - name: Black
      value: 900
